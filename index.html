<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro Cloud Pro 2026</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        :root {
            --primary: #f8fafc; --accent: #60a5fa; --success: #34d399;
            --danger: #f87171; --bg: #020617; --white: #1e293b;
            --text: #f1f5f9; --card-bg: rgba(30, 41, 59, 0.8); 
            --border: rgba(255, 255, 255, 0.15); --purple: #a78bfa;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; transition: 0.4s; overflow-x: hidden; }
        .glass { backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); background: var(--card-bg); border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        .container { max-width: 1600px; margin: 0 auto; display: none; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; border-radius: 20px; margin-bottom: 25px; gap: 20px; }
        
        button { cursor: pointer; border-radius: 12px; font-weight: 600; border: none; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; color: #fff; font-size: 13px; }
        .btn-main { padding: 10px 16px; background: rgba(255,255,255,0.1); }
        .btn-main:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }

        .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
        .card { padding: 18px; border-radius: 20px; border-left: 4px solid var(--accent); }

        .section-box { border-radius: 20px; margin-bottom: 15px; overflow: hidden; }
        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; cursor: pointer; background: rgba(255,255,255,0.03); }
        .section-content { padding: 20px; overflow-x: auto; transition: max-height 0.3s ease; }
        .collapsed { display: none !important; }

        table { width: 100%; border-collapse: collapse; min-width: 1300px; }
        th { font-size: 10px; padding: 10px; opacity: 0.6; text-transform: uppercase; border: 1px solid var(--border); text-align: center; background: rgba(255,255,255,0.02); }
        td { padding: 4px; border: 1px solid var(--border); position: relative; }
        
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper span { position: absolute; left: 5px; font-size: 9px; opacity: 0.4; pointer-events: none; }
        
        input, select { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid transparent; border-radius: 6px; padding: 8px; font-size: 12px; width: 100%; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--accent); background: rgba(255,255,255,0.1); }
        
        .status-select { background-color: #1e293b !important; color: #fff !important; }
        input.val-month { padding-left: 20px; text-align: right; }
        input.venc-in { text-align: center; color: var(--accent); font-weight: bold; }

        #agenda-side { position: fixed; right: -400px; top: 0; width: 340px; height: 100%; z-index: 5000; padding: 30px; transition: 0.5s; background: #0f172a; border-left: 1px solid var(--border); }
        #agenda-side.open { right: 0; }
        #agenda-text { width: 100%; height: 80%; background: #020617; color: #fff; border: 1px solid var(--border); border-radius: 15px; padding: 15px; resize: none; }

        #calc { position: fixed; top: 100px; left: 100px; width: 250px; padding: 20px; border-radius: 25px; z-index: 6000; display: none; background: #111; border: 1px solid #333; }
        .calc-screen { width: 100%; height: 50px; background: #000; color: #10b981; text-align: right; padding: 10px; font-size: 20px; border: none; }
    </style>
</head>
<body>

<div id="login-container">
    <div class="login-card glass" style="padding: 40px; border-radius: 30px; width: 340px; margin: 15vh auto; text-align: center;">
        <h2 style="margin-bottom: 25px;">💎 Financeiro Pro</h2>
        <input type="email" id="login-email" placeholder="E-mail">
        <input type="password" id="login-pass" placeholder="Senha">
        <button onclick="handleAuth()" style="width:100%; padding:14px; background:var(--accent); justify-content: center; margin-top: 20px;">Entrar</button>
        <p id="login-msg" style="color: var(--danger); font-size: 12px; margin-top: 10px;"></p>
    </div>
</div>

<div class="container" id="main-app">
    <header class="glass">
        <div>
            <h2 style="margin:0; font-size: 18px;">Dash Finanças</h2>
            <div id="last-sync" style="font-size: 9px; opacity: 0.5;">Sincronizado via Nuvem</div>
        </div>
        <div class="btn-group">
            <button class="btn-main glass" onclick="toggleCalc()"><i data-lucide="calculator" size="16"></i> Calc</button>
            <button class="btn-main glass" onclick="toggleAgenda()"><i data-lucide="book-open" size="16"></i> Agenda</button>
            <button id="btn-save" class="btn-main" style="background:var(--success)" onclick="saveData()"><i data-lucide="cloud" size="16"></i> Salvar</button>
            <button class="btn-main" style="background:var(--danger)" onclick="handleLogout()"><i data-lucide="log-out" size="16"></i> Sair</button>
        </div>
    </header>

    <div class="summary-grid">
        <div class="card glass" style="border-left-color: var(--success);"><small>RECEITA ANUAL</small><p id="res-r" style="color:var(--success)">R$ 0,00</p></div>
        <div class="card glass" style="border-left-color: var(--purple);"><small>APORTES ANUAL</small><p id="res-a" style="color:var(--purple)">R$ 0,00</p></div>
        <div class="card glass" style="border-left-color: var(--danger);"><small>GASTOS ANUAL</small><p id="res-p" style="color:var(--danger)">R$ 0,00</p></div>
        <div class="card glass" style="border-left-color: var(--accent);"><small>SALDO LÍQUIDO</small><p id="res-s">R$ 0,00</p></div>
    </div>

    <div class="section-box glass" id="box-r">
        <div class="section-header" onclick="toggleSection('box-r')">
            <div style="display:flex; align-items:center; gap:10px;">
                <i data-lucide="eye" size="16"></i>
                <h3 style="margin:0; font-size:14px; color:var(--success)">💰 Contas a Receber</h3>
            </div>
            <button class="btn-main" style="background:var(--success); padding: 4px 10px;" onclick="event.stopPropagation(); addRow('tbody-receber', 'v-r')">+</button>
        </div>
        <div class="section-content" id="content-box-r">
            <table>
                <thead>
                    <tr><th style="width: 200px;">Descrição</th><th style="width: 80px;">Venc.</th><th>JAN</th><th>FEV</th><th>MAR</th><th>ABR</th><th>MAI</th><th>JUN</th><th>JUL</th><th>AGO</th><th>SET</th><th>OUT</th><th>NOV</th><th>DEZ</th><th style="width:50px;"></th></tr>
                </thead>
                <tbody id="tbody-receber"></tbody>
            </table>
        </div>
    </div>

    <div class="section-box glass" id="box-p">
        <div class="section-header" onclick="toggleSection('box-p')">
            <div style="display:flex; align-items:center; gap:10px;">
                <i data-lucide="eye" size="16"></i>
                <h3 style="margin:0; font-size:14px; color:var(--danger)">📉 Contas a Pagar</h3>
            </div>
            <button class="btn-main" style="background:var(--danger); padding: 4px 10px;" onclick="event.stopPropagation(); addRow('tbody-pagar', 'v-p')">+</button>
        </div>
        <div class="section-content" id="content-box-p">
            <table><tbody id="tbody-pagar"></tbody></table>
        </div>
    </div>

    <div class="section-box glass" id="box-a">
        <div class="section-header" onclick="toggleSection('box-a')">
            <div style="display:flex; align-items:center; gap:10px;">
                <i data-lucide="eye" size="16"></i>
                <h3 style="margin:0; font-size:14px; color:var(--purple)">🚀 Aportes</h3>
            </div>
            <button class="btn-main" style="background:var(--purple); padding: 4px 10px;" onclick="event.stopPropagation(); addRow('tbody-aportes', 'v-a')">+</button>
        </div>
        <div class="section-content" id="content-box-a">
            <table><tbody id="tbody-aportes"></tbody></table>
        </div>
    </div>

    <div class="section-box glass" id="box-m">
        <div class="section-header" onclick="toggleSection('box-m')">
            <div style="display:flex; align-items:center; gap:10px;">
                <i data-lucide="eye" size="16"></i>
                <h3 style="margin:0; font-size:14px; color:var(--accent)">🎯 Metas</h3>
            </div>
            <button class="btn-main" style="background:var(--accent); padding: 4px 10px;" onclick="event.stopPropagation(); addMetaRow()">+</button>
        </div>
        <div class="section-content" id="content-box-m"><table><tbody id="tbody-metas"></tbody></table></div>
    </div>

    <div class="glass" style="padding: 20px; border-radius: 20px; height: 300px;"><canvas id="expenseChart"></canvas></div>
</div>

<div id="agenda-side" class="glass">
    <h3 style="margin-top:0">📝 Notas Cloud</h3>
    <textarea id="agenda-text"></textarea>
    <button onclick="toggleAgenda()" style="margin-top:15px; background:var(--danger); width:100%; justify-content:center; padding:12px">Fechar Agenda</button>
</div>

<div id="calc" class="glass">
    <input type="text" class="calc-screen" id="display" disabled>
    <div class="calc-btns">
        <button onclick="clearCalc()" style="background:var(--danger)">C</button>
        <button onclick="btnCalc('%')">%</button><button onclick="backCalc()">←</button><button onclick="btnCalc('/')">/</button>
        <button onclick="btnCalc('7')">7</button><button onclick="btnCalc('8')">8</button><button onclick="btnCalc('9')">9</button><button onclick="btnCalc('*')">×</button>
        <button onclick="btnCalc('4')">4</button><button onclick="btnCalc('5')">5</button><button onclick="btnCalc('6')">6</button><button onclick="btnCalc('-')">-</button>
        <button onclick="btnCalc('1')">1</button><button onclick="btnCalc('2')">2</button><button onclick="btnCalc('3')">3</button><button onclick="btnCalc('+')">+</button>
        <button onclick="btnCalc('0')" style="grid-column: span 2">0</button><button onclick="btnCalc('.')">.</button><button onclick="resCalc()" style="background:var(--success)">=</button>
    </div>
</div>

<script>
    const S_URL = 'https://xpamnljjxvfnpzdmuive.supabase.co'; 
    const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwYW1ubGpqeHZmbnB6ZG11aXZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAzOTA2ODIsImV4cCI6MjA4NTk2NjY4Mn0.ePhhjJcpYAiVM3f6LRD66LKVhnUv854lvztudybx6_Q';
    const supabaseClient = window.supabase.createClient(S_URL, S_KEY);
    
    let userLogged = null, chart;
    const months = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];

    window.onload = async () => {
        lucide.createIcons();
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) { userLogged = session.user; showDashboard(); }
    };

    async function handleAuth() {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-pass').value;
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) document.getElementById('login-msg').innerText = "Erro no acesso.";
        else { userLogged = data.user; showDashboard(); }
    }

    function showDashboard() {
        document.getElementById('login-container').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        initChart(); dragElement(document.getElementById("calc")); loadData();
    }

    function handleLogout() { supabaseClient.auth.signOut().then(() => location.reload()); }
    
    function toggleSection(boxId) { 
        const content = document.getElementById('content-' + boxId);
        content.classList.toggle('collapsed');
        const icon = document.getElementById(boxId).querySelector('i');
        if (content.classList.contains('collapsed')) icon.setAttribute('data-lucide', 'eye-off');
        else icon.setAttribute('data-lucide', 'eye');
        lucide.createIcons();
    }

    function toggleAgenda() { document.getElementById('agenda-side').classList.toggle('open'); }
    function toggleCalc() { const c = document.getElementById('calc'); c.style.display = (c.style.display === 'block') ? 'none' : 'block'; }

    // ADICIONA LINHA MATRIZ PARA TODAS AS TABELAS
    function addRow(target, type, data = null) {
        const tbody = document.getElementById(target);
        const tr = document.createElement('tr');
        let inputs = '';
        for(let i=0; i<12; i++) {
            const v = data ? data.vals[i] : 0;
            inputs += `<td><div class="input-wrapper"><span>R$</span><input type="number" class="val-month ${type}" value="${v}" oninput="updateAll()"></div></td>`;
        }
        tr.innerHTML = `
            <td><input type="text" class="desc-row" value="${data ? data.d : ''}" placeholder="Descrição..."></td>
            <td><input type="text" class="venc-in" value="${data ? data.venc : ''}" placeholder="Dia"></td>
            ${inputs}
            <td style="text-align:center;"><button style="color:var(--danger); background:none" onclick="this.parentElement.parentElement.remove(); updateAll()"><i data-lucide="trash-2" size="14"></i></button></td>
        `;
        tbody.appendChild(tr);
        lucide.createIcons();
        updateAll();
    }

    function addMetaRow(data = null) {
        const tbody = document.getElementById('tbody-metas');
        const tr = document.createElement('tr');
        const st = data ? data.s : 'iniciar';
        tr.innerHTML = `
            <td style="width:70%"><input type="text" class="meta-d" value="${data ? data.d : ''}"></td>
            <td><select class="status-select st-${st}" onchange="this.className='status-select st-'+this.value"><option value="iniciar" ${st==='iniciar'?'selected':''}>A iniciar</option><option value="andamento" ${st==='andamento'?'selected':''}>Em andamento</option><option value="concluido" ${st==='concluido'?'selected':''}>Concluído</option></select></td>
            <td style="text-align:center;"><button style="color:var(--danger); background:none" onclick="this.parentElement.parentElement.remove()"><i data-lucide="trash-2" size="14"></i></button></td>
        `;
        tbody.appendChild(tr);
        lucide.createIcons();
    }

    function updateAll() {
        let tR = 0, tP = 0, tA = 0;
        let mEx = Array(12).fill(0);

        document.querySelectorAll('.v-r').forEach(el => tR += parseFloat(el.value) || 0);
        document.querySelectorAll('.v-a').forEach(el => tA += parseFloat(el.value) || 0);

        document.querySelectorAll('#tbody-pagar tr').forEach(row => {
            row.querySelectorAll('.v-p').forEach((el, idx) => {
                const val = parseFloat(el.value) || 0;
                tP += val;
                mEx[idx % 12] += val;
            });
        });

        document.getElementById('res-r').innerText = "R$ " + tR.toLocaleString();
        document.getElementById('res-p').innerText = "R$ " + tP.toLocaleString();
        document.getElementById('res-a').innerText = "R$ " + tA.toLocaleString();
        
        const saldoLiquido = tR - (tP + tA);
        document.getElementById('res-s').innerText = "R$ " + saldoLiquido.toLocaleString();
        document.getElementById('res-s').style.color = saldoLiquido < 0 ? 'var(--danger)' : 'var(--success)';
        
        if(chart) { chart.data.datasets[0].data = mEx; chart.update(); }
    }

    function initChart() {
        const ctx = document.getElementById('expenseChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'bar',
            data: { labels: months, datasets: [{ data: Array(12).fill(0), backgroundColor: '#60a5fa', borderRadius: 5 }] },
            options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false }, ticks: {color: '#fff'} } } }
        });
    }

    function btnCalc(v) { document.getElementById('display').value += v; }
    function clearCalc() { document.getElementById('display').value = ''; }
    function backCalc() { const d = document.getElementById('display'); d.value = d.value.slice(0, -1); }
    function resCalc() { try { document.getElementById('display').value = eval(document.getElementById('display').value.replace('%', '/100')); } catch { document.getElementById('display').value = 'Erro'; } }
    
    function dragElement(e) {
        let p1=0,p2=0,p3=0,p4=0;
        e.onmousedown = (m) => { if(m.target.tagName==='BUTTON' || m.target.tagName==='INPUT') return; m.preventDefault(); p3=m.clientX; p4=m.clientY; document.onmouseup=()=>{document.onmouseup=null;document.onmousemove=null;}; document.onmousemove=(m)=>{p1=p3-m.clientX;p2=p4-m.clientY;p3=m.clientX;p4=m.clientY;e.style.top=(e.offsetTop-p2)+"px";e.style.left=(e.offsetLeft-p1)+"px";};};
    }

    async function saveData() {
        const b = document.getElementById('btn-save'); b.innerText = "...";
        const gMat = (id) => Array.from(document.querySelectorAll(`#${id} tr`)).map(tr => ({ 
            d: tr.querySelector('.desc-row').value, 
            venc: tr.querySelector('.venc-in').value,
            vals: Array.from(tr.querySelectorAll('.val-month')).map(i => i.value) 
        }));
        const m = () => Array.from(document.querySelectorAll('#tbody-metas tr')).map(tr => ({ d: tr.querySelector('.meta-d').value, s: tr.querySelector('select').value }));
        const payload = { r: gMat('tbody-receber'), p: gMat('tbody-pagar'), a: gMat('tbody-aportes'), m: m(), n: document.getElementById('agenda-text').value, sync: new Date() };
        await supabaseClient.from('finance_data').upsert({ id: userLogged.id, content: payload, updated_at: new Date() });
        b.innerHTML = `<i data-lucide="check"></i> Salvo`; lucide.createIcons();
        setTimeout(() => { b.innerHTML = `<i data-lucide="cloud"></i> Salvar`; lucide.createIcons(); }, 2000);
    }

    async function loadData() {
        const { data } = await supabaseClient.from('finance_data').select('content').eq('id', userLogged.id).maybeSingle();
        if(data?.content) {
            const c = data.content;
            if(c.r) c.r.forEach(x => addRow('tbody-receber', 'v-r', x));
            if(c.p) c.p.forEach(x => addRow('tbody-pagar', 'v-p', x));
            if(c.a) c.a.forEach(x => addRow('tbody-aportes', 'v-a', x));
            if(c.m) c.m.forEach(x => addMetaRow(x));
            document.getElementById('agenda-text').value = c.n || "";
            updateAll(); lucide.createIcons();
        }
    }
</script>
</body>
</html>
