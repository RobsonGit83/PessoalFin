<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro Cloud Pro 2026</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        :root {
            --primary: #0f172a; --accent: #3b82f6; --success: #10b981;
            --danger: #ef4444; --bg: #f8fafc; --white: #ffffff;
            --text: #334155; --card-bg: rgba(255, 255, 255, 0.8); --border: rgba(226, 232, 240, 0.8);
            --purple: #8b5cf6; --gray: #94a3b8;
        }

        body.dark {
            --primary: #f8fafc; --accent: #60a5fa; --success: #34d399;
            --danger: #f87171; --bg: #020617; --white: #1e293b;
            --text: #f1f5f9; --card-bg: rgba(45, 55, 72, 0.9); --border: rgba(255, 255, 255, 0.2);
        }

        body { 
            font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); 
            margin: 0; padding: 20px; transition: 0.4s;
            background-image: radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.05) 0px, transparent 50%);
        }

        .glass {
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            background: var(--card-bg); border: 1px solid var(--border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }

        .container { max-width: 1100px; margin: 0 auto; display: none; animation: fadeIn 0.6s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 25px; border-radius: 20px; margin-bottom: 25px; z-index: 100; position: relative; }

        button { 
            cursor: pointer; border-radius: 10px; font-weight: 600; border: none; 
            transition: 0.3s; display: inline-flex; align-items: center; gap: 8px;
            color: var(--text);
        }
        button:hover { transform: translateY(-2px); filter: brightness(1.2); }

        .btn-main { padding: 10px 18px; font-size: 13px; }
        
        /* Correção específica para botões no Dark Mode */
        body.dark .glass { background: rgba(30, 41, 59, 0.95); border-color: rgba(255,255,255,0.15); }
        body.dark button.glass { color: #fff; background: rgba(51, 65, 85, 0.9); }

        .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
        .card { padding: 20px; border-radius: 20px; }
        .card p { margin: 5px 0 0; font-size: 20px; font-weight: 700; }

        .section-box { border-radius: 20px; margin-bottom: 15px; position: relative; z-index: 1; }
        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; cursor: pointer; }
        
        table { width: 100%; border-collapse: collapse; }
        th { font-size: 11px; padding: 12px; opacity: 0.5; text-transform: uppercase; }
        td { padding: 8px 4px; border-bottom: 1px solid var(--border); }
        
        input, select { 
            background: rgba(0,0,0,0.05); color: var(--text); border: 1px solid transparent; 
            border-radius: 8px; padding: 10px; font-size: 13px; width: 100%;
        }
        body.dark input, body.dark select { background: rgba(255,255,255,0.05); }

        /* Agenda Lateral */
        #agenda-side { 
            position: fixed; right: -380px; top: 0; width: 340px; height: 100%; 
            z-index: 3000; padding: 30px; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }
        #agenda-side.open { right: 0; }
        #agenda-text { width: 100%; height: 80%; background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 15px; }

        /* Calculadora */
        #calc { position: absolute; width: 260px; padding: 20px; border-radius: 24px; z-index: 2000; display: none; background: #111; color: #fff; }
        .calc-screen { width: 100%; height: 50px; background: #000; color: #0f0; border-radius: 10px; margin-bottom: 10px; text-align: right; padding: 10px; font-size: 20px; border: none; }
        .calc-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .calc-btns button { padding: 12px; border-radius: 8px; background: #333; color: #fff; justify-content: center; }

        /* CORREÇÃO DO MENU EXPORTAR */
        .export-menu { position: relative; }
        .export-content { 
            display: none; position: absolute; top: 110%; right: 0; 
            min-width: 160px; border-radius: 12px; z-index: 5000 !important; /* Camada altíssima */
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .export-content button { width: 100%; border-radius: 0; padding: 12px; background: transparent; color: var(--text); border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>

<div id="login-container">
    <div class="login-card glass" style="padding: 40px; border-radius: 30px; width: 330px; margin: 15vh auto; text-align: center;">
        <h2 style="margin-bottom: 20px;">💎 Financeiro Cloud</h2>
        <input type="email" id="login-email" placeholder="E-mail">
        <input type="password" id="login-pass" placeholder="Senha">
        <button onclick="handleAuth()" style="width:100%; padding:15px; background:var(--accent); color:white; margin-top: 20px; justify-content: center;">Entrar</button>
        <p id="login-msg" style="color: var(--danger); font-size: 12px; margin-top: 10px;"></p>
    </div>
</div>

<div class="container" id="main-app">
    <header class="glass">
        <div class="header-title-group">
            <h2 style="margin:0; font-weight: 700;">Dash Finanças</h2>
            <div id="last-sync" class="sync-info" style="font-size: 10px; opacity: 0.6;">Aguardando sincronização...</div>
        </div>
        <div class="btn-group">
            <button class="btn-main glass" onclick="toggleCalc()"><i data-lucide="calculator"></i> Calc</button>
            <div class="export-menu">
                <button class="btn-main glass" style="color: var(--purple)" onclick="toggleExport()"><i data-lucide="download"></i> Exportar</button>
                <div id="export-list" class="export-content glass">
                    <button onclick="exportExcel()">Excel (.xlsx)</button>
                    <button onclick="exportPDF()">PDF (.pdf)</button>
                </div>
            </div>
            <button class="btn-main glass" onclick="toggleAgenda()"><i data-lucide="book-marked"></i> Agenda</button>
            <button id="btn-save" class="btn-main" style="background:var(--success); color:white" onclick="saveData()"><i data-lucide="cloud-upload"></i> Salvar</button>
            <button class="btn-main glass" onclick="toggleDark()"><i data-lucide="moon"></i></button>
            <button class="btn-main" style="background:var(--danger); color:white" onclick="handleLogout()"><i data-lucide="log-out"></i></button>
        </div>
    </header>

    <div class="summary-grid">
        <div class="card glass"><small>RECEITAS</small><p id="res-r" style="color:var(--success)">R$ 0,00</p></div>
        <div class="card glass"><small>DESPESAS</small><p id="res-p" style="color:var(--danger)">R$ 0,00</p></div>
        <div class="card glass"><small>APORTES</small><p id="res-a" style="color:var(--purple)">R$ 0,00</p></div>
        <div class="card glass"><small>SALDO</small><p id="res-s">R$ 0,00</p></div>
    </div>

    <div class="section-box glass">
        <div class="section-header" onclick="toggleSection('sec-r')">
            <h3 style="margin:0; font-size:15px; color:var(--success)">Contas a Receber</h3>
            <button class="btn-main" style="background:var(--success); color:white" onclick="event.stopPropagation(); addRow('tbody-receber', 'v-r')">+</button>
        </div>
        <div id="sec-r" class="section-content"><table><tbody id="tbody-receber"></tbody></table></div>
    </div>

    <div class="section-box glass">
        <div class="section-header" onclick="toggleSection('sec-p')">
            <h3 style="margin:0; font-size:15px; color:var(--danger)">Contas a Pagar</h3>
            <button class="btn-main" style="background:var(--danger); color:white" onclick="event.stopPropagation(); addRow('tbody-pagar', 'v-p')">+</button>
        </div>
        <div id="sec-p" class="section-content"><table><tbody id="tbody-pagar"></tbody></table></div>
    </div>

    <div class="section-box glass">
        <div class="section-header" onclick="toggleSection('sec-a')">
            <h3 style="margin:0; font-size:15px; color:var(--purple)">Aportes</h3>
            <button class="btn-main" style="background:var(--purple); color:white" onclick="event.stopPropagation(); addRow('tbody-aportes', 'v-a')">+</button>
        </div>
        <div id="sec-a" class="section-content"><table><tbody id="tbody-aportes"></tbody></table></div>
    </div>

    <div class="section-box glass">
        <div class="section-header" onclick="toggleSection('sec-m')">
            <h3 style="margin:0; font-size:15px; color:var(--accent)">Metas</h3>
            <button class="btn-main" style="background:var(--accent); color:white" onclick="event.stopPropagation(); addMetaRow()">+</button>
        </div>
        <div id="sec-m" class="section-content"><table><tbody id="tbody-metas"></tbody></table></div>
    </div>

    <div class="glass" style="padding: 20px; border-radius: 20px; height: 300px;"><canvas id="expenseChart"></canvas></div>
</div>

<div id="agenda-side" class="glass">
    <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
        <h3>📝 Notas</h3><button onclick="toggleAgenda()" style="background:var(--danger); color:white; padding:5px 10px;">X</button>
    </div>
    <textarea id="agenda-text"></textarea>
</div>

<div id="calc">
    <input type="text" class="calc-screen" id="display" disabled>
    <div class="calc-btns">
        <button onclick="clearCalc()">C</button><button onclick="btnCalc('%')">%</button><button onclick="backCalc()">←</button><button onclick="btnCalc('/')">/</button>
        <button onclick="btnCalc('7')">7</button><button onclick="btnCalc('8')">8</button><button onclick="btnCalc('9')">9</button><button onclick="btnCalc('*')">×</button>
        <button onclick="btnCalc('4')">4</button><button onclick="btnCalc('5')">5</button><button onclick="btnCalc('6')">6</button><button onclick="btnCalc('-')">-</button>
        <button onclick="btnCalc('1')">1</button><button onclick="btnCalc('2')">2</button><button onclick="btnCalc('3')">3</button><button onclick="btnCalc('+')">+</button>
        <button onclick="btnCalc('0')" style="grid-column: span 2">0</button><button onclick="btnCalc('.')">.</button><button onclick="resCalc()" style="background:var(--success)">=</button>
    </div>
</div>

<script>
    const S_URL = 'https://xpamnljjxvfnpzdmuive.supabase.co'; 
    const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwYW1ubGpqeHZmbnB6ZG11aXZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAzOTA2ODIsImV4cCI6MjA4NTk2NjY4Mn0.ePhhjJcpYAiVM3f6LRD66LKVhnUv854lvztudybx6_Q';
    const supabaseClient = window.supabase.createClient(S_URL, S_KEY);
    
    let userLogged = null, chart;
    const months = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];

    window.onload = async () => {
        lucide.createIcons();
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) { userLogged = session.user; showDashboard(); }
    };

    async function handleAuth() {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-pass').value;
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) { document.getElementById('login-msg').innerText = "Erro no acesso."; } 
        else { userLogged = data.user; showDashboard(); }
    }

    function showDashboard() {
        document.getElementById('login-container').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        initChart(); dragElement(document.getElementById("calc")); loadData();
    }

    function handleLogout() { supabaseClient.auth.signOut().then(() => location.reload()); }
    function toggleSection(id) { document.getElementById(id).classList.toggle('hidden'); }
    function toggleAgenda() { document.getElementById('agenda-side').classList.toggle('open'); }
    function toggleCalc() { const c = document.getElementById('calc'); c.style.display = (c.style.display === 'block') ? 'none' : 'block'; }
    function toggleExport() { const e = document.getElementById('export-list'); e.style.display = (e.style.display === 'block') ? 'none' : 'block'; }
    
    function toggleDark() { 
        document.body.classList.toggle('dark'); 
        if(chart) {
            chart.options.scales.x.ticks.color = document.body.classList.contains('dark') ? '#fff' : '#888';
            chart.update();
        }
    }

    function addRow(target, type, data = null) {
        const tbody = document.getElementById(target);
        const tr = document.createElement('tr');
        let mOpts = months.map((m, i) => `<option value="${i}" ${data && data.m == i ? 'selected' : ''}>${m}</option>`).join('');
        tr.innerHTML = `
            <td style="width:50%"><input type="text" value="${data ? data.d : ''}" placeholder="Descrição"></td>
            <td><select onchange="updateAll()">${mOpts}</select></td>
            <td><input type="number" class="val-input ${type}" value="${data ? data.v : 0}" oninput="updateAll()"></td>
            <td style="text-align:center"><button style="color:var(--danger); background:none" onclick="this.parentElement.parentElement.remove(); updateAll()">✕</button></td>
        `;
        tbody.appendChild(tr);
        updateAll();
    }

    function addMetaRow(data = null) {
        const tbody = document.getElementById('tbody-metas');
        const tr = document.createElement('tr');
        const st = data ? data.s : 'iniciar';
        tr.innerHTML = `
            <td style="width:70%"><input type="text" value="${data ? data.d : ''}" placeholder="Meta"></td>
            <td><select class="st-${st}" onchange="this.className='st-'+this.value"><option value="iniciar" ${st==='iniciar'?'selected':''}>A iniciar</option><option value="andamento" ${st==='andamento'?'selected':''}>Em andamento</option><option value="concluido" ${st==='concluido'?'selected':''}>Concluído</option><option value="cancelado" ${st==='cancelado'?'selected':''}>Cancelado</option></select></td>
            <td style="text-align:center"><button style="color:var(--danger); background:none" onclick="this.parentElement.parentElement.remove()">✕</button></td>
        `;
        tbody.appendChild(tr);
    }

    function updateAll() {
        let tR = 0, tP = 0, tA = 0, mEx = Array(12).fill(0);
        document.querySelectorAll('tbody tr').forEach(row => {
            const vIn = row.querySelector('.val-input');
            const mSel = row.querySelector('select');
            if(vIn && mSel) {
                const v = parseFloat(vIn.value) || 0, m = parseInt(mSel.value);
                if(vIn.classList.contains('v-r')) tR += v;
                if(vIn.classList.contains('v-p')) { tP += v; mEx[m] += v; }
                if(vIn.classList.contains('v-a')) tA += v;
            }
        });
        document.getElementById('res-r').innerText = "R$ " + tR.toFixed(2);
        document.getElementById('res-p').innerText = "R$ " + tP.toFixed(2);
        document.getElementById('res-a').innerText = "R$ " + tA.toFixed(2);
        const sf = tR - tP - tA;
        document.getElementById('res-s').innerText = "R$ " + sf.toFixed(2);
        document.getElementById('res-s').style.color = sf < 0 ? 'var(--danger)' : 'var(--accent)';
        if(chart) { chart.data.datasets[0].data = mEx; chart.update(); }
    }

    function initChart() {
        const ctx = document.getElementById('expenseChart').getContext('2d');
        Chart.register(ChartDataLabels);
        chart = new Chart(ctx, {
            type: 'bar',
            data: { labels: months, datasets: [{ data: Array(12).fill(0), backgroundColor: '#ef4444', borderRadius: 8 }] },
            options: {
                maintainAspectRatio: false,
                plugins: { legend: { display: false }, datalabels: { color: '#888', anchor: 'end', align: 'top', formatter: Math.round } },
                scales: { y: { display: false }, x: { grid: { display: false }, ticks: { color: '#888' } } }
            }
        });
    }

    function btnCalc(v) { document.getElementById('display').value += v; }
    function clearCalc() { document.getElementById('display').value = ''; }
    function backCalc() { const d = document.getElementById('display'); d.value = d.value.slice(0, -1); }
    function resCalc() { try { document.getElementById('display').value = eval(document.getElementById('display').value.replace('%', '/100')); } catch { document.getElementById('display').value = 'Erro'; } }
    function dragElement(e) {
        let p1=0,p2=0,p3=0,p4=0;
        e.onmousedown = (m) => { if(m.target.tagName==='BUTTON') return; m.preventDefault(); p3=m.clientX; p4=m.clientY; document.onmouseup=()=>{document.onmouseup=null;document.onmousemove=null;}; document.onmousemove=(m)=>{p1=p3-m.clientX;p2=p4-m.clientY;p3=m.clientX;p4=m.clientY;e.style.top=(e.offsetTop-p2)+"px";e.style.left=(e.offsetLeft-p1)+"px";};};
    }

    function exportExcel() {
        const rows = Array.from(document.querySelectorAll('tbody tr')).map(tr => [
            tr.querySelector('input')?.value || "",
            tr.querySelector('select')?.options[tr.querySelector('select')?.selectedIndex]?.text || "",
            tr.querySelector('.val-input')?.value || "0"
        ]);
        const ws = XLSX.utils.aoa_to_sheet([["Descrição", "Mês", "Valor"], ...rows]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Dados");
        XLSX.writeFile(wb, "Financeiro.xlsx");
        toggleExport();
    }

    function exportPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const rows = Array.from(document.querySelectorAll('tbody tr')).map(tr => [
            tr.querySelector('input')?.value || "",
            tr.querySelector('select')?.options[tr.querySelector('select')?.selectedIndex]?.text || "",
            "R$ " + (tr.querySelector('.val-input')?.value || "0")
        ]);
        doc.autoTable({ head: [['Descrição', 'Mês', 'Valor']], body: rows });
        doc.save("Financeiro.pdf");
        toggleExport();
    }

    async function saveData() {
        const b = document.getElementById('btn-save'); 
        b.innerText = "Sincronizando...";
        const g = (id) => Array.from(document.querySelectorAll(`#${id} tr`)).map(tr => ({ d: tr.querySelector('input').value, m: tr.querySelector('select').value, v: tr.querySelector('.val-input').value }));
        const m = () => Array.from(document.querySelectorAll('#tbody-metas tr')).map(tr => ({ d: tr.querySelector('input').value, s: tr.querySelector('select').value }));
        const now = new Date();
        const { error } = await supabaseClient.from('finance_data').upsert({ id: userLogged.id, content: { r: g('tbody-receber'), p: g('tbody-pagar'), a: g('tbody-aportes'), m: m(), n: document.getElementById('agenda-text').value, sync: now }, updated_at: now });
        if (!error) {
            document.getElementById('last-sync').innerText = "Backup: " + now.toLocaleTimeString();
            b.innerHTML = `<i data-lucide="check"></i> Salvo`; lucide.createIcons();
        }
        setTimeout(() => { b.innerHTML = `<i data-lucide="cloud-upload"></i> Salvar`; lucide.createIcons(); }, 2000);
    }

    async function loadData() {
        const { data } = await supabaseClient.from('finance_data').select('content').eq('id', userLogged.id).maybeSingle();
        if(data?.content) {
            const c = data.content;
            if(c.r) c.r.forEach(x => addRow('tbody-receber', 'v-r', x));
            if(c.p) c.p.forEach(x => addRow('tbody-pagar', 'v-p', x));
            if(c.a) c.a.forEach(x => addRow('tbody-aportes', 'v-a', x));
            if(c.m) c.m.forEach(x => addMetaRow(x));
            document.getElementById('agenda-text').value = c.n || "";
            if(c.sync) document.getElementById('last-sync').innerText = "Backup: " + new Date(c.sync).toLocaleTimeString();
            updateAll();
        }
    }
</script>
</body>
</html>
